<!DOCTYPE html>
<html>
<head>
    <title>Customer Segmentation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Customer Segmentation</h1>
        <p>Choose how you want to input customer data:</p>

        <form method="POST" action="/predict" enctype="multipart/form-data">
            <h2>Manual Input</h2>
            <input type="hidden" name="option" value="manual">
            <label>Recency:</label>
            <input type="number" step="any" name="recency" required>
            <label>Frequency:</label>
            <input type="number" step="any" name="frequency" required>
            <label>Monetary:</label>
            <input type="number" step="any" name="monetary" required>
            <button type="submit">Predict Cluster</button>
        </form>

        <hr>

        <form method="POST" action="/predict" enctype="multipart/form-data">
            <h2>Upload CSV</h2>
            <input type="hidden" name="option" value="csv">
            <input type="file" name="file" accept=".csv" required>
            <button type="submit">Upload & Predict</button>
        </form>
    </div>
</body>
</html>
